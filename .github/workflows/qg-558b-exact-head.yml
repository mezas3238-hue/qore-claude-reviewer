name: QG 558b exact Core head

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qg-558b-exact-head.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact QORE Core head
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 558b3868620375df917891c4202eae695d1c9eba

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest coverage
        run: pytest --cov=src/qore --cov-report=term-missing

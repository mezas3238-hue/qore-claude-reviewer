name: Trace R62N scanner environment after TryStar

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-star-nested-final.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 35d48570b93473da7bfd4ae0a50073bc253cba76
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Trace scanner state using exact flow successor replacement
        run: |
          python - <<'PY'
          import ast
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          module_name = 'qore_r62n_trystar_downstream_probe'
          safe = (
              'b = len\n'
              'try:\n'
              '    try:\n'
              f'        from {module_name} import *\n'
              '    finally:\n'
              '        b = lambda _: 3\n'
              'except* AttributeError:\n'
              '    pass\n'
              'result = b("abc")\n'
          )
          dangerous = (
              'b = len\n'
              'try:\n'
              f'    from {module_name} import *\n'
              'except* AttributeError:\n'
              '    pass\n'
              'result = b("1+1")\n'
          )

          class TraceScanner(n._R62NBoundedExceptionalLoopGlobalsScanner):
              def _scan_statement(self, node: ast.stmt, environment: dict[str, n._Value]) -> None:
                  if isinstance(node, ast.TryStar):
                      print('BEFORE_TRYSTAR', environment)
                      initial = (environment.copy(), {})
                      completed = n._r62n_process_try(
                          node,
                          initial,
                          top_index=0,
                          timeline={},
                          observations={},
                          precision_lost=[False],
                      )
                      normals = [
                          outcome.state[0]
                          for outcome in completed
                          if outcome.kind == 'normal'
                      ]
                      print('NORMALS', normals)
                      environment.clear()
                      if normals:
                          self._merge_environments(environment, *normals)
                      print('AFTER_TRYSTAR', environment)
                      return
                  if isinstance(node, ast.Assign) and node.lineno >= 5:
                      print('BEFORE_ASSIGN', node.lineno, environment)
                  super()._scan_statement(node, environment)
                  if isinstance(node, ast.Assign) and node.lineno >= 5:
                      print('AFTER_ASSIGN', node.lineno, environment)

          for name, source in [('SAFE', safe), ('DANGER', dangerous)]:
              print('===', name, '===')
              scanner = TraceScanner()
              print('markers=', scanner.scan(source))
          PY

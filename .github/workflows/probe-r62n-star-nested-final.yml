name: Probe exact R62N TryStar failed-star paths

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-star-nested-final.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 903c0e2e221f51df705873f90ff9ec18d58101fe
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Falsify exact published candidate
        run: |
          python - <<'PY'
          import builtins as py_builtins
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')

          module_name = 'qore_r62n_exact_trystar_probe'
          module = n._R62NStarImportModule(module_name)
          module.__all__ = ['b', 'missing']
          module.b = py_builtins.eval
          sys.modules[module_name] = module
          try:
              specimens = {
                  'handler_danger': (
                      'b = len\n'
                      'try:\n'
                      f'    from {module_name} import *\n'
                      'except* AttributeError:\n'
                      '    result = b("1+1")\n'
                  ),
                  'downstream_danger': (
                      'b = len\n'
                      'try:\n'
                      f'    from {module_name} import *\n'
                      'except* AttributeError:\n'
                      '    pass\n'
                      'result = b("1+1")\n'
                  ),
                  'handler_safe': (
                      'b = len\n'
                      'try:\n'
                      '    try:\n'
                      f'        from {module_name} import *\n'
                      '    finally:\n'
                      '        b = lambda _: 3\n'
                      'except* AttributeError:\n'
                      '    result = b("abc")\n'
                  ),
                  'downstream_safe': (
                      'b = len\n'
                      'try:\n'
                      '    try:\n'
                      f'        from {module_name} import *\n'
                      '    finally:\n'
                      '        b = lambda _: 3\n'
                      'except* AttributeError:\n'
                      '    pass\n'
                      'result = b("abc")\n'
                  ),
                  'partial_group_first_handler_danger': (
                      'b = len\n'
                      'try:\n'
                      '    try:\n'
                      f'        from {module_name} import *\n'
                      '    finally:\n'
                      '        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])\n'
                      'except* AttributeError:\n'
                      '    result = b("1+1")\n'
                      'except* ValueError:\n'
                      '    pass\n'
                  ),
                  'partial_group_second_handler_danger': (
                      'b = len\n'
                      'try:\n'
                      '    try:\n'
                      f'        from {module_name} import *\n'
                      '    finally:\n'
                      '        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])\n'
                      'except* AttributeError:\n'
                      '    pass\n'
                      'except* ValueError:\n'
                      '    result = b("1+1")\n'
                  ),
              }
              expected_runtime = {
                  'handler_danger': 2,
                  'downstream_danger': 2,
                  'handler_safe': 3,
                  'downstream_safe': 3,
                  'partial_group_first_handler_danger': 2,
                  'partial_group_second_handler_danger': 2,
              }
              for name, source in specimens.items():
                  runtime = n._runtime_result(source)
                  markers = n._r62n_dynamic_execution_markers_from_source(source)
                  print(f'{name}: runtime={runtime} markers={markers}')
                  assert runtime == expected_runtime[name]
                  if name.endswith('_danger'):
                      call_line = next(
                          index for index, line in enumerate(source.splitlines(), 1)
                          if 'result = b(' in line
                      )
                      assert f'call:{call_line}' in markers, (
                          f'material false negative: {name}; expected call:{call_line}, got {markers}'
                      )
              # Safe cases are observations; their marker shape is precision evidence.
          finally:
              sys.modules.pop(module_name, None)
          PY

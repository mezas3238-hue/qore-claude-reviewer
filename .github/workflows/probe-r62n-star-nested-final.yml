name: Probe R62N TryStar downstream authority

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-star-nested-final.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 35d48570b93473da7bfd4ae0a50073bc253cba76
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute isolated TryStar downstream witnesses
        run: |
          python - <<'PY'
          import builtins
          import importlib
          import sys
          import types
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          module_name = 'qore_r62n_trystar_downstream_probe'
          module = types.ModuleType(module_name)
          module.__all__ = ['b', 'missing']
          module.b = builtins.eval
          sys.modules[module_name] = module

          dangerous = (
              'b = len\n'
              'try:\n'
              f'    from {module_name} import *\n'
              'except* AttributeError:\n'
              '    pass\n'
              'result = b("1+1")\n'
          )
          safe = (
              'b = len\n'
              'try:\n'
              '    try:\n'
              f'        from {module_name} import *\n'
              '    finally:\n'
              '        b = lambda _: 3\n'
              'except* AttributeError:\n'
              '    pass\n'
              'result = b("abc")\n'
          )

          try:
              for name, source, expected, should_mark in (
                  ('trystar_downstream_danger', dangerous, 2, True),
                  ('trystar_downstream_unconditional_safe_rebind', safe, 3, False),
              ):
                  ns: dict[str, object] = {}
                  exec(compile(source, f'<{name}>', 'exec', dont_inherit=True), ns)
                  markers = n._r62n_dynamic_execution_markers_from_source(source)
                  print(name, 'runtime=', ns.get('result'), 'markers=', markers)
                  assert ns.get('result') == expected
                  if should_mark:
                      assert markers, f'material FN: {name}'
                  else:
                      assert markers == (), f'unexpected FP: {name}: {markers}'
          finally:
              sys.modules.pop(module_name, None)
          PY

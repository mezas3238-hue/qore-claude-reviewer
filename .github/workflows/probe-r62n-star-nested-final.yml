name: Diagnose R62N TryStar successor flow

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-star-nested-final.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 35d48570b93473da7bfd4ae0a50073bc253cba76
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Inspect TryStar abstract successor states
        run: |
          python - <<'PY'
          import ast
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          module_name = 'qore_r62n_trystar_downstream_probe'
          source = (
              'b = len\n'
              'try:\n'
              '    try:\n'
              f'        from {module_name} import *\n'
              '    finally:\n'
              '        b = lambda _: 3\n'
              'except* AttributeError:\n'
              '    pass\n'
              'result = b("abc")\n'
          )
          tree = ast.parse(source)
          try_node = tree.body[1]
          assert isinstance(try_node, ast.TryStar)
          initial = (
              {
                  '__builtins__': n._r12._BUILTINS_NAMESPACE,
                  'b': n._UNKNOWN,
              },
              {},
          )
          timeline = {}
          observations = {}
          precision_lost = [False]
          outcomes = n._r62n_process_try(
              try_node,
              initial,
              top_index=0,
              timeline=timeline,
              observations=observations,
              precision_lost=precision_lost,
          )
          print('precision_lost=', precision_lost[0])
          for index, outcome in enumerate(outcomes):
              env = outcome.state[0]
              print(
                  'OUTCOME', index,
                  'kind=', outcome.kind,
                  'b=', env.get('b'),
                  'star=', env.get(n._R62N_STAR_IMPORT_TAINT),
                  'exception=', env.get(n._R62N_EXCEPTION_TAG),
              )
          obs, full_timeline, full_precision = n._r62n_flow(source)
          print('FLOW precision=', full_precision)
          for index, states in sorted(full_timeline.items()):
              print('TIMELINE', index, [
                  (state.get('b'), state.get(n._R62N_STAR_IMPORT_TAINT))
                  for state in states
              ])
          print('markers=', n._r62n_dynamic_execution_markers_from_source(source))
          PY

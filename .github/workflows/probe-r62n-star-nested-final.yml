name: Probe R62N nested failed-star and finally paths

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-star-nested-final.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: e87778368efc8887b50c1be94bae7381842ac3a6
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute focused runtime/scanner probes
        run: |
          python - <<'PY'
          import builtins
          import importlib
          import sys
          import types
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          module_name = 'qore_r62n_nested_star_probe'
          module = types.ModuleType(module_name)
          module.__all__ = ['b', 'missing']
          module.b = builtins.eval
          sys.modules[module_name] = module
          cases = {
              'outer_handler_danger': 'b = len\ntry:\n    try:\n        from ' + module_name + ' import *\n    finally:\n        marker = 1\nexcept AttributeError:\n    result = b("1+1")\n',
              'downstream_danger': 'b = len\ntry:\n    try:\n        from ' + module_name + ' import *\n    finally:\n        marker = 1\nexcept AttributeError:\n    pass\nresult = b("1+1")\n',
              'finally_danger_before_safe_rebind': 'b = len\ntry:\n    from ' + module_name + ' import *\nexcept AttributeError:\n    pass\nfinally:\n    result = b("1+1")\n    b = len\n',
              'handler_rebind_safe': 'b = len\ntry:\n    from ' + module_name + ' import *\nexcept AttributeError:\n    b = len\nresult = b("abc")\n',
              'nested_finally_rebind_safe': 'b = len\ntry:\n    try:\n        from ' + module_name + ' import *\n    finally:\n        b = len\nexcept AttributeError:\n    result = b("abc")\n',
          }
          for name, source in cases.items():
              ns: dict[str, object] = {}
              exec(compile(source, f'<{name}>', 'exec', dont_inherit=True), ns)
              markers = n._r62n_dynamic_execution_markers_from_source(source)
              print(name, 'runtime=', ns.get('result'), 'markers=', markers)
          PY

name: Probe R62N failed-star import ordering

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-current-freeze.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Core candidate
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 9a3b44e6b19fab5e9cd72ef9013d031b6ef0cc6d
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute failed-star ordering probes
        run: |
          python - <<'PY'
          import builtins
          import importlib
          import sys
          import types
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')

          def probe(name: str, order: list[str], expected_runtime: int) -> tuple[str, ...]:
              module = types.ModuleType('qore_r62n_star_probe')
              module.__all__ = order
              module.b = builtins.eval
              sys.modules['qore_r62n_star_probe'] = module
              source = "b = len\ntry:\n    from qore_r62n_star_probe import *\nexcept AttributeError:\n    pass\nresult = b(\"1+1\")\n"
              namespace: dict[str, object] = {}
              exec(compile(source, '<failed-star>', 'exec', dont_inherit=True), namespace)
              markers = n._r62n_dynamic_execution_markers_from_source(source)
              print(name, 'runtime=', namespace.get('result'), 'markers=', markers)
              assert namespace.get('result') == expected_runtime
              return markers

          danger = probe('star_partial_before_failure', ['b', 'missing'], 2)
          safe = probe('star_failure_before_binding', ['missing', 'b'], 3)
          if not danger:
              raise AssertionError('material FN: failed star import lost earlier dangerous binding')
          print('safe_inverse_observation=', safe)
          PY

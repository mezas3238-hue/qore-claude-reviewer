name: Diagnose R62N nested TryStar outer state
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-r62n-trystar-outer-state.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 751979b55040186ad77e149981fcf5266eaedb14
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Diagnose exact flow outcomes
        run: |
          python - <<'PY'
          import ast
          import importlib
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')

          cases = {
              'dangerous': '''b = len\ntry:\n    try:\n        raise ExceptionGroup("eg", [AttributeError("a")])\n    except* AttributeError:\n        b = eval\n        raise ValueError("new")\n    except* ValueError:\n        b = len\nexcept ValueError:\n    result = b("1+1")\n''',
              'safe': '''b = eval\ntry:\n    try:\n        raise ExceptionGroup("eg", [AttributeError("a")])\n    except* AttributeError:\n        b = len\n        raise ValueError("new")\n    except* ValueError:\n        b = eval\nexcept ValueError:\n    result = b("abc")\n''',
          }
          for name, source in cases.items():
              tree = ast.parse(source)
              outer = tree.body[1]
              assert isinstance(outer, ast.Try)
              initial = ({'__builtins__': n._r12._BUILTINS_NAMESPACE}, {})
              n._r62j._r62j_apply_straight_line_module_binding(tree.body[0], initial[0])
              print('\nCASE', name, 'initial b=', initial[0].get('b'))
              outcomes = n._r62n_process_block(outer.body, [initial], top_index=0, timeline={}, observations={}, precision_lost=[False])
              for i, outcome in enumerate(outcomes):
                  print('BODY', i, outcome.kind, 'b=', outcome.state[0].get('b'), 'tag=', outcome.state[0].get(n._R62N_EXCEPTION_TAG))
              completed = n._r62n_process_try(outer, initial, top_index=0, timeline={}, observations={}, precision_lost=[False])
              for i, outcome in enumerate(completed):
                  print('OUTER', i, outcome.kind, 'b=', outcome.state[0].get('b'), 'tag=', outcome.state[0].get(n._R62N_EXCEPTION_TAG))
              print('MARKERS_OLD=', n._r62n_dynamic_execution_markers_from_source(source))
          PY

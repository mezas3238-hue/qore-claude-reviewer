name: Probe R62N bare reraise combinations

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-bare-reraise-combination.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean candidate
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 69b8afb392e6d57cc13c68cb964f7f3365d25d46
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Falsify mixed pending exception semantics
        run: |
          python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')

          def src(*lines: str) -> str:
              return '\n'.join(lines) + '\n'

          def run(name: str, text: str, expected: object, dangerous: bool, *, expected_caught: type[BaseException] | None = None) -> None:
              ns: dict[str, object] = {}
              caught: BaseException | None = None
              try:
                  exec(compile(text, f'<{name}>', 'exec', dont_inherit=True), ns)
              except BaseException as exc:
                  caught = exc
              markers = n._r62n_dynamic_execution_markers_from_source(text)
              calls = tuple(m for m in markers if m.startswith('call:'))
              print(name, 'runtime=', ns.get('result'), 'caught=', type(caught).__name__ if caught else None, 'markers=', markers)
              assert ns.get('result') == expected
              if expected_caught is None:
                  assert caught is None
              else:
                  assert isinstance(caught, expected_caught)
              if dangerous:
                  assert calls, (name, 'FN', markers)
              else:
                  assert calls == (), (name, 'FP', markers)

          run('bare_plus_new_safe', src(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise',
              '    except* ValueError:','        b = len','        raise TypeError("new")',
              'except BaseExceptionGroup:','    result = b("abc")'), 3, False)

          run('bare_plus_new_danger', src(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = len','        raise',
              '    except* ValueError:','        b = eval','        raise TypeError("new")',
              'except BaseExceptionGroup:','    result = b("1+1")'), 2, True)

          run('new_then_bare_safe', src(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise TypeError("new")',
              '    except* ValueError:','        b = len','        raise',
              'except BaseExceptionGroup:','    result = b("abc")'), 3, False)

          run('new_then_bare_danger', src(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = len','        raise TypeError("new")',
              '    except* ValueError:','        b = eval','        raise',
              'except BaseExceptionGroup:','    result = b("1+1")'), 2, True)

          # finally observes the completed except* chain before the combined group escapes
          run('mixed_finally_safe', src(
              'b = eval','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              'except* AttributeError:','    b = eval','    raise',
              'except* ValueError:','    b = len','    raise TypeError("new")',
              'finally:','    result = b("abc")'), 3, False, expected_caught=BaseExceptionGroup)

          run('mixed_finally_danger', src(
              'b = len','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              'except* AttributeError:','    b = len','    raise',
              'except* ValueError:','    b = eval','    raise TypeError("new")',
              'finally:','    result = b("1+1")'), 2, True, expected_caught=BaseExceptionGroup)

          # The combined propagated object remains catchable as ExceptionGroup and uses final handler state.
          run('outer_exceptiongroup_safe', src(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise',
              '    except* ValueError:','        b = len','        raise TypeError("new")',
              'except ExceptionGroup:','    result = b("abc")'), 3, False)

          run('outer_exceptiongroup_danger', src(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = len','        raise',
              '    except* ValueError:','        b = eval','        raise TypeError("new")',
              'except ExceptionGroup:','    result = b("1+1")'), 2, True)

          # Outer except* routing must retain the newly raised TypeError member.
          run('outer_star_type_safe', src(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise',
              '    except* ValueError:','        b = len','        raise TypeError("new")',
              'except* TypeError:','    result = b("abc")','except* AttributeError:','    pass'), 3, False)

          run('outer_star_type_danger', src(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = len','        raise',
              '    except* ValueError:','        b = eval','        raise TypeError("new")',
              'except* TypeError:','    result = b("1+1")','except* AttributeError:','    pass'), 2, True)

          print('CLEAN_MIXED_PENDING_MATRIX_OK 10 cases')
          PY

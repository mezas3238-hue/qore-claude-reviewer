name: Probe 558b R62G transported builtins

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-558b-r62g-transport.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact QORE Core head
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 558b3868620375df917891c4202eae695d1c9eba

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff exact guard files
        run: |
          ruff check \
            tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py \
            tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py

      - name: Permanent R62G and R62N suites
        run: |
          pytest -q \
            tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62g_guards.py \
            tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py

      - name: Adversarial transported builtins matrix
        working-directory: tests/infrastructure
        run: |
          python - <<'PY'
          import test_universal_cross_asset_conformance_final_owner_r62g_guards as r62g

          safe = (
              'import builtins\nresult = (builtins,)[0]["eval"]("1+1")\n',
              'import builtins\nresult = [builtins][0]["eval"]("1+1")\n',
              'import builtins\nholder = (builtins,)\nb = holder[0]\nresult = b["eval"]("1+1")\n',
              'import builtins\nholder = [builtins]\nresult = holder[0].get("eval")("1+1")\n',
              'import builtins\nimport operator\nresult = operator.getitem((builtins,)[0], "eval")("1+1")\n',
              'import builtins\nimport operator\nresult = operator.itemgetter("eval")((builtins,)[0])("1+1")\n',
          )
          dangerous = (
              'import builtins\nresult = builtins.__dict__["eval"]("1+1")\n',
              'import builtins\nresult = vars(builtins)["eval"]("1+1")\n',
              'import builtins\nresult = (builtins.__dict__,)[0]["eval"]("1+1")\n',
              'import builtins\nimport operator\nresult = operator.getitem(builtins.__dict__, "eval")("1+1")\n',
              'import builtins\nimport operator\nresult = operator.itemgetter("eval")(builtins.__dict__)("1+1")\n',
              'result = __builtins__["eval"]("1+1")\n',
          )

          for index, source in enumerate(safe, start=1):
              error = r62g._r62g_runtime_mapping_error(source)
              markers = r62g._r62g_dynamic_execution_markers_from_source(source)
              print(f'safe-{index}: error={error.__name__} markers={markers}')
              assert error in {TypeError, AttributeError}
              assert not any(marker.startswith('call:') for marker in markers)

          for index, source in enumerate(dangerous, start=1):
              result = r62g._r62g_runtime_result(source)
              markers = r62g._r62g_dynamic_execution_markers_from_source(source)
              print(f'dangerous-{index}: result={result} markers={markers}')
              assert result == 2
              assert markers

          print('R62G exact-head adversarial matrix: OK')
          PY

name: Adjudicate Claude C2 control-flow finding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/adjudicate-c2-controlflow.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact QORE Core HEAD
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: aa909351ce6e4d3f82b77bcfe318986e730eae87
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute control-flow and expression-order witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          r62k = getattr(importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62k_guards'), '_r62k_dynamic_execution_markers_from_source')
          cases = {
            'try_import': 'def run():\n    return globals()["b"].eval("1+1")\ntry:\n    import builtins as b\nexcept ImportError:\n    pass\nresult = run()\n',
            'if_true_import': 'def run():\n    return globals()["b"].eval("1+1")\nif True:\n    import builtins as b\nresult = run()\n',
            'if_false_safe': 'def run():\n    return globals()["b"].eval("1+1")\nif False:\n    import builtins as b\ntry:\n    result = run()\nexcept KeyError:\n    result = 3\n',
            'same_statement_safe_rebind': 'def run():\n    return globals()["b"].eval("1+1")\nimport builtins as b\ntry:\n    result = ((b := len), run())[1]\nexcept AttributeError:\n    result = 3\n',
          }
          def runtime(src):
              ns = {}
              exec(compile(src, '<probe>', 'exec', dont_inherit=True), ns)
              return ns.get('result')
          for name, src in cases.items():
              print(f'{name}: runtime={runtime(src)!r} r62k={r62k(src)!r}')
          PY

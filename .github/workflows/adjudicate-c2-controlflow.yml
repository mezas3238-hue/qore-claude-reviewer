name: Probe R62N ordering and exception adjacencies

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: f5f62da1fb5367cd050b36be6fe59758ccde5f22
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute ordering and exception matrix
        env:
          PROBE_ZLIB_B64: ''
        run: |
          python - <<'PY'
          import base64, os, zlib
          script = zlib.decompress(base64.b64decode(os.environ['PROBE_ZLIB_B64'])).decode('utf-8')
          exec(compile(script, '<r62n-ordering-probe>', 'exec'))
          PY

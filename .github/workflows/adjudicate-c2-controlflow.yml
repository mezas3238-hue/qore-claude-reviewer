name: Inspect R62N flow state

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 72bc45153fd8b15834f2d50951b473ae93f30824
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Inspect R62N abstract flow
        run: |
          python3 - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          k = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62k_guards')
          j = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62j_guards')
          cases = {
          'safe_explicit': '''import builtins as b
          def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          try:
              b = len
              raise RuntimeError
          except RuntimeError:
              result = run()
          ''',
          'for_break': '''import builtins as b
          def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          for _ in (0,):
              b = len
              break
          else:
              import builtins as b
              result = run()
          result = run()
          ''',
          }
          for name, src in cases.items():
              flow = n._r62n_flow(src)
              print('CASE', name)
              print('precision', flow[2])
              print('owner_by_call', k._r62k_top_level_owner_calls(src))
              print('escaped', k._r62k_escaped_owners(src))
              print('observations', flow[0])
              print('timeline', flow[1])
              print('fallback', n._r62n_future_authority_by_call(src, flow[1]))
              print('observable', n._r62n_observable_authority_by_call(src))
              print('markers', n._r62n_dynamic_execution_markers_from_source(src))
          PY

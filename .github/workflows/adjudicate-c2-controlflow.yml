name: Audit R62N adjacent control-flow precision

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: d470860e56af4fed3dacadde8a39152f07fbca51
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute adversarial matrix
        env:
          PROBE_ZLIB_B64: ''
        run: |
          python - <<'PY'
          import base64, os, zlib
          script = zlib.decompress(base64.b64decode(os.environ['PROBE_ZLIB_B64'])).decode('utf-8')
          exec(compile(script, '<r62n-adversarial-audit>', 'exec'))
          PY

name: Adjudicate R62L abrupt control flow

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 2ce54c0c332fcab23b068d3370aa85ee8bd75b8e
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute R62L abrupt-flow witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          r62l = getattr(importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62l_guards'), '_r62l_dynamic_execution_markers_from_source')
          cases = {
            'partial_try_handler': '''def run():
              return globals()["b"].eval("1+1")
          try:
              import builtins as b
              raise RuntimeError
          except RuntimeError:
              result = run()
          b = len
          ''',
            'break_skips_safe_rebind': '''def run():
              return globals()["b"].eval("1+1")
          for _ in (0,):
              import builtins as b
              break
              b = len
          result = run()
          ''',
            'compound_alias': '''def run():
              return globals()["b"].eval("1+1")
          if True:
              alias = run
              import builtins as b
              result = alias()
          b = len
          ''',
            'safe_handler': '''def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          try:
              raise RuntimeError
          except RuntimeError:
              b = len
              result = run()
          ''',
          }
          def runtime(src):
              ns = {}
              exec(compile(src, '<probe>', 'exec', dont_inherit=True), ns)
              return ns.get('result')
          for name, src in cases.items():
              print(f'{name}: runtime={runtime(src)!r} r62l={r62l(src)!r}')
          PY

name: Adjudicate R62M adjacent flow

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 4379261608aea1baff52dffab281d840b6b845c4
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute R62M adjacent witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          r62m = getattr(importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62m_guards'), '_r62m_dynamic_execution_markers_from_source')
          cases = {
            'implicit_exception_after_import': '''def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          try:
              import builtins as b
              1 / 0
          except ZeroDivisionError:
              result = run()
          b = len
          ''',
            'safe_rebind_before_explicit_raise': '''import builtins as b
          def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          try:
              b = len
              raise RuntimeError
          except RuntimeError:
              result = run()
          ''',
            'safe_rebind_before_implicit_raise': '''import builtins as b
          def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          try:
              b = len
              1 / 0
          except ZeroDivisionError:
              result = run()
          ''',
            'second_iteration_observation': '''def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          b = len
          for _ in (0, 1):
              result = run()
              import builtins as b
          b = len
          ''',
            'while_second_iteration_observation': '''def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          b = len
          i = 0
          while i < 2:
              result = run()
              import builtins as b
              i += 1
          b = len
          ''',
            'safe_single_iteration': '''def run():
              return getattr(globals()["b"], "eval", lambda _: 3)("1+1")
          b = len
          for _ in (0,):
              result = run()
              b = len
          result = run()
          ''',
          }
          def runtime(src):
              ns = {}
              exec(compile(src, '<probe>', 'exec', dont_inherit=True), ns)
              return ns.get('result')
          for name, src in cases.items():
              print(f'{name}: runtime={runtime(src)!r} r62m={r62m(src)!r}')
          PY

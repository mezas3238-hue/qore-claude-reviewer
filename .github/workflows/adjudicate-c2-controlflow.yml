name: Probe R62N observable namespace repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/adjudicate-c2-controlflow.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: aaa0a680a127fe0aa01131cb97125033d78f68a3
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute R62N precision matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          cases = {
              'safe_explicit': 'import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    b = len\n    raise RuntimeError\nexcept RuntimeError:\n    result = run()\n',
              'finalized_safe': 'import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    raise RuntimeError\nexcept RuntimeError:\n    b = len\nfinally:\n    result = run()\n',
              'for_break_skips_else': 'import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nfor _ in (0,):\n    b = len\n    break\nelse:\n    import builtins as b\n    result = run()\nresult = run()\n',
              'handler_type_mismatch': 'import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    try:\n        raise ValueError\n    except KeyError:\n        result = run()\nexcept ValueError:\n    b = len\n    result = run()\n',
              'namedexpr_safe_before_raise': 'import builtins as b\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    ((b := len), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n',
              'namedexpr_danger_before_raise': 'import builtins\ndef run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\ntry:\n    ((b := builtins), 1 / 0)\nexcept ZeroDivisionError:\n    result = run()\n',
              'implicit_exception_after_import': 'def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\ntry:\n    import builtins as b\n    1 / 0\nexcept ZeroDivisionError:\n    result = run()\nb = len\n',
              'second_iteration_for': 'def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\nfor _ in (0, 1):\n    result = run()\n    import builtins as b\nb = len\n',
              'second_iteration_while': 'def run():\n    return getattr(globals()["b"], "eval", lambda _: 3)("1+1")\nb = len\ni = 0\nwhile i < 2:\n    result = run()\n    import builtins as b\n    i += 1\nb = len\n',
          }
          def runtime(src):
              ns = {}
              exec(compile(src, '<probe>', 'exec', dont_inherit=True), ns)
              return ns.get('result')
          for name, src in cases.items():
              try:
                  value = runtime(src)
              except Exception as exc:
                  value = f'EXC:{type(exc).__name__}:{exc}'
              print(f'{name}: runtime={value!r} r62n={n._r62n_dynamic_execution_markers_from_source(src)!r}')
          PY
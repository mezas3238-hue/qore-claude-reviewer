name: Probe R62N final adversarial matrix

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-final-matrix.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewer payload
        uses: actions/checkout@v4
        with:
          path: reviewer
          persist-credentials: false
      - name: Checkout exact Core candidate
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 35d48570b93473da7bfd4ae0a50073bc253cba76
          path: core
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute canonical adversarial payload with exact adjudication
        run: |
          python - <<'PY'
          import base64
          import re
          import subprocess
          import sys
          import zlib
          from pathlib import Path

          workflow = Path('reviewer/.github/workflows/adjudicate-c2-controlflow.yml').read_text()
          match = re.search(r"PROBE_ZLIB_B64: '([^']+)'", workflow)
          if match is None:
              raise SystemExit('canonical adversarial payload not found')
          script = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          Path('/tmp/r62n-final-matrix.py').write_text(script)
          completed = subprocess.run(
              [sys.executable, '/tmp/r62n-final-matrix.py'],
              cwd='core',
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          output = completed.stdout
          print(output, end='')
          if completed.returncode == 0:
              raise SystemExit(0)

          expected_failure = "failed_import_before_builtin_alias: marker expected=False actual=('call:3',)"
          failure_lines = [
              line.strip()
              for line in output.splitlines()
              if line.startswith('FAIL ')
          ]
          if failure_lines != [
              "FAIL failed_import_before_builtin_alias: result=3 exc=None markers=('call:3',)"
          ]:
              raise AssertionError(f'unexpected mandatory matrix failures: {failure_lines!r}')
          if 'SUMMARY must_failures=1' not in output or expected_failure not in output:
              raise AssertionError('canonical known conservative boundary fingerprint changed')

          expected_observations = {
              "OBSERVE with_exit_raises_skips_body_successor: result=3 exc=None markers=('call:8',)",
              "OBSERVE boolop_short_circuit_safe: result=3 exc=None markers=('binding:5',)",
              "OBSERVE ifexp_unselected_safe: result=3 exc=None markers=('binding:5',)",
              "OBSERVE handler_target_cleanup: result=3 exc=None markers=('call:7',)",
          }
          observations = {
              line.strip()
              for line in output.splitlines()
              if line.startswith('OBSERVE ')
          }
          if observations != expected_observations:
              raise AssertionError(
                  f'conservative observation fingerprint changed: {observations!r}'
              )
          print('ADJUDICATED known conservative boundaries only; no new material failure')
          PY

name: Claude infrastructure smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/claude-infra-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewer infrastructure
        uses: actions/checkout@v4

      - name: Verify Claude Code OAuth subscription authentication
        id: claude-oauth
        uses: anthropics/claude-code-action/base-action@main
        with:
          prompt: |
            This is a credential smoke test only.
            Do not modify any file and do not run shell commands.
            Return structured output with status exactly QORE_CLAUDE_OAUTH_OK.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 1
            --allowedTools "Read"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","const":"QORE_CLAUDE_OAUTH_OK"}},"required":["status"],"additionalProperties":false}'
          show_full_output: false

      - name: Verify Claude OAuth smoke result
        env:
          RESULT: ${{ steps.claude-oauth.outputs.structured_output }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$RESULT" | jq -r '.status')" = "QORE_CLAUDE_OAUTH_OK"
          echo "Claude Code OAuth authentication OK."

      - name: Validate configured GitHub App private key locally
        env:
          APP_PRIVATE_KEY: ${{ secrets.QORE_CLAUDE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY" || { echo "QORE_CLAUDE_APP_PRIVATE_KEY is empty" >&2; exit 1; }
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/qore-claude-app.pem"
          openssl pkey -in "$RUNNER_TEMP/qore-claude-app.pem" -check -noout >/dev/null
          echo "GitHub App PEM parses and passes local key consistency check."
          rm -f "$RUNNER_TEMP/qore-claude-app.pem"

      - name: Create QORE Claude Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.QORE_CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.QORE_CLAUDE_APP_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
          permission-contents: read
          permission-pull-requests: read

      - name: Verify qore-core read access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/mezas3238-hue/qore-core/pulls/461 \
            --jq '{number,state,merged,base:.base.sha,head:.head.sha}'
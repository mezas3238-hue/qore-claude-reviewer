name: Claude infrastructure smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/claude-infra-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.251
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code OAuth subscription authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN_RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN_RAW" | tr -d '[:space:]')"
          test -n "$CLEAN_TOKEN"
          RAW_LEN="${#CLAUDE_CODE_OAUTH_TOKEN_RAW}"
          CLEAN_LEN="${#CLEAN_TOKEN}"
          REMAINING_WS="$(printf '%s' "$CLEAN_TOKEN" | grep -o '[[:space:]]' | wc -l || true)"
          echo "OAuth token structural check: raw_len=${RAW_LEN}; clean_len=${CLEAN_LEN}; remaining_whitespace=${REMAINING_WS}"
          test "$REMAINING_WS" = "0"
          export CLAUDE_CODE_OAUTH_TOKEN="$CLEAN_TOKEN"
          set +e
          claude -p 'Reply exactly QORE_CLAUDE_OAUTH_OK' \
            --max-turns 3 \
            --allowedTools Read \
            --output-format json \
            > "$RUNNER_TEMP/claude-oauth-smoke.json" \
            2> "$RUNNER_TEMP/claude-oauth-smoke.err"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            RAW="$CLAUDE_CODE_OAUTH_TOKEN_RAW" CLEAN="$CLEAN_TOKEN" \
              python3 - "$RUNNER_TEMP/claude-oauth-smoke.json" "$RUNNER_TEMP/claude-oauth-smoke.err" <<'PY'
          import json
          import os
          import pathlib
          import sys

          raw = os.environ.get("RAW", "")
          clean = os.environ.get("CLEAN", "")
          for path in sys.argv[1:]:
              text = pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
              for secret in (raw, clean):
                  if secret:
                      text = text.replace(secret, "[REDACTED]")
              if not text.strip():
                  continue
              try:
                  payload = json.loads(text)
              except json.JSONDecodeError:
                  print(text)
              else:
                  safe = {
                      "is_error": payload.get("is_error"),
                      "result": payload.get("result"),
                      "subtype": payload.get("subtype"),
                      "stop_reason": payload.get("stop_reason"),
                  }
                  safe_text = json.dumps(safe, ensure_ascii=False)
                  for secret in (raw, clean):
                      if secret:
                          safe_text = safe_text.replace(secret, "[REDACTED]")
                  print(safe_text)
          PY
            exit "$STATUS"
          fi
          unset CLAUDE_CODE_OAUTH_TOKEN_RAW CLEAN_TOKEN CLAUDE_CODE_OAUTH_TOKEN
          python3 - "$RUNNER_TEMP/claude-oauth-smoke.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("is_error"):
              raise SystemExit(f"Claude Code OAuth smoke failed: {payload.get('result')}")
          result = str(payload.get("result", "")).strip()
          if "QORE_CLAUDE_OAUTH_OK" not in result:
              raise SystemExit(f"Unexpected Claude result: {result!r}")
          print("Claude Code OAuth subscription authentication OK.")
          PY
          rm -f "$RUNNER_TEMP/claude-oauth-smoke.json" "$RUNNER_TEMP/claude-oauth-smoke.err"

      - name: Validate configured GitHub App private key locally
        env:
          APP_PRIVATE_KEY: ${{ secrets.QORE_CLAUDE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY" || { echo "QORE_CLAUDE_APP_PRIVATE_KEY is empty" >&2; exit 1; }
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/qore-claude-app.pem"
          openssl pkey -in "$RUNNER_TEMP/qore-claude-app.pem" -check -noout >/dev/null
          echo "GitHub App PEM parses and passes local key consistency check."
          rm -f "$RUNNER_TEMP/qore-claude-app.pem"

      - name: Create QORE Claude Reviewer installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.QORE_CLAUDE_APP_CLIENT_ID }}
          private-key: ${{ secrets.QORE_CLAUDE_APP_PRIVATE_KEY }}
          owner: mezas3238-hue
          repositories: qore-core
          permission-contents: read
          permission-pull-requests: read

      - name: Verify qore-core read access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/mezas3238-hue/qore-core/pulls/461 \
            --jq '{number,state,merged,base:.base.sha,head:.head.sha}'
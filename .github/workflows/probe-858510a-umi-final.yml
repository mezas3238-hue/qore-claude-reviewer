name: Probe 858510a UMI final audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-858510a-umi-final.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Core candidate
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 858510a806eb20745924101bd506cfeac94daa7b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Install tooling
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen scope and oracle
        run: |
          test "$(git merge-base ebd0adf000874797653df92ea1c08a892cce6c8c HEAD)" = ebd0adf000874797653df92ea1c08a892cce6c8c
          if git diff --name-only ebd0adf000874797653df92ea1c08a892cce6c8c..HEAD -- src/qore | grep -q .; then
            echo 'ERROR src/qore delta is non-zero'
            git diff --name-only ebd0adf000874797653df92ea1c08a892cce6c8c..HEAD -- src/qore
            exit 1
          fi
          test "$(git hash-object tests/infrastructure/test_universal_cross_asset_conformance_full_closure.py)" = 249caa1504e2b62277a9389dc7e73bcabf12e7db
          echo 'SCOPE_OK src/qore=0 oracle=249caa1504e2b62277a9389dc7e73bcabf12e7db'
      - name: Run final owner and historical closure contracts
        run: |
          pytest -q \
            tests/infrastructure/test_universal_cross_asset_conformance_final_owner_guards.py \
            tests/infrastructure/test_universal_cross_asset_conformance_full_closure.py \
            tests/infrastructure/test_universal_cross_asset_conformance_full_closure_guards.py

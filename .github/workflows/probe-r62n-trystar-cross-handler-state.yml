name: Probe R62N TryStar cross-handler state

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-trystar-cross-handler-state.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Core freeze
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: cb5d264dac42f2bf3b6f12acb8da070efd7c8191
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Reproduce cross-handler state semantics
        env:
          PROBE_B64: 
        run: python -c 'import base64, os; exec(compile(base64.b64decode(os.environ["PROBE_B64"]), "<probe>", "exec"))'

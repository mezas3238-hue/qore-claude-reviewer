name: Probe R62N TryStar cross-handler state

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-trystar-cross-handler-state.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewer probe
        uses: actions/checkout@v4
      - name: Checkout exact Core staging
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 1f5dc74085a2949e4c338c7d72040391d4a2cbc0
          path: core
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Apply unpublished v2 patch
        run: python core/.github/patches/r62n_trystar_cross_handler_patch.txt
      - name: Apply and inspect bounded v3 candidate
        run: python .github/scripts/probe_r62n_trystar_candidate.py
      - name: Install
        run: pip install -e './core[dev]'
      - name: Targeted R62N suite
        working-directory: core
        run: pytest -q tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Ruff target
        working-directory: core
        run: ruff check tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py
      - name: Mypy target
        working-directory: core
        run: mypy tests/infrastructure/test_universal_cross_asset_conformance_final_owner_r62n_guards.py

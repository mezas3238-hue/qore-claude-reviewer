name: Probe R62N TryStar cross-handler state

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-r62n-trystar-cross-handler-state.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Core staging
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: 1f5dc74085a2949e4c338c7d72040391d4a2cbc0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Apply unpublished bounded patch in workspace
        run: python .github/patches/r62n_trystar_cross_handler_patch.txt
      - name: Install
        run: pip install -e '.[dev]'
      - name: Trace scanner paths for false positives
        run: |
          python - <<'PY'
          import ast
          import builtins
          import importlib
          import sys
          import traceback
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')
          module_name = 'qore_r62n_trace_probe'
          module = n._R62NStarImportModule(module_name)
          module.__all__ = ['b', 'missing']
          module.b = builtins.eval
          sys.modules[module_name] = module

          safe = f'''\
          b = len
          try:
              try:
                  from {module_name} import *
              except AttributeError:
                  raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])
          except* AttributeError:
              b = lambda _: 3
          except* ValueError:
              result = b("1+1")
          '''
          final_safe = '''\
          b = len
          try:
              raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])
          except* AttributeError:
              b = eval
          except* ValueError:
              b = lambda _: 3
          finally:
              result = b("1+1")
          '''

          class TracingScanner(n._R62NBoundedExceptionalLoopGlobalsScanner):
              def _evaluate_call(self, node: ast.Call, environment):
                  if node.lineno >= 5:
                      print('TRACE_CALL line=', node.lineno, 'func=', ast.unparse(node.func), 'b=', environment.get('b'), 'taint=', environment.get(n._R62N_STAR_IMPORT_TAINT))
                      traceback.print_stack(limit=10)
                  return super()._evaluate_call(node, environment)

          try:
              print('=== SAFE ===')
              print('markers=', TracingScanner().scan(safe))
              print('=== FINAL_SAFE ===')
              print('markers=', TracingScanner().scan(final_safe))
          finally:
              sys.modules.pop(module_name, None)
          PY

name: Probe exact Core TryStar sequencing freeze

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-751979b-trystar-sequencing.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Core candidate
        uses: actions/checkout@v4
        with:
          repository: mezas3238-hue/qore-core
          ref: a29c622ca692a2f01efe2c6c1e4b1df4e9c59484
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Execute expanded TryStar falsification matrix
        run: |
          python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('tests/infrastructure').resolve()))
          n = importlib.import_module('test_universal_cross_asset_conformance_final_owner_r62n_guards')

          def source(*lines: str) -> str:
              return "\n".join(lines) + "\n"

          def execute(name: str, text: str, expected: object, *, dangerous: bool, caught_type: str | None = None) -> None:
              namespace: dict[str, object] = {}
              caught: BaseException | None = None
              try:
                  exec(compile(text, f'<{name}>', 'exec', dont_inherit=True), namespace)
              except BaseException as exc:
                  caught = exc
              markers = n._r62n_dynamic_execution_markers_from_source(text)
              runtime = namespace.get('result')
              actual_caught = type(caught).__name__ if caught else None
              print(name, 'runtime=', runtime, 'caught=', actual_caught, 'markers=', markers)
              assert runtime == expected, (name, runtime, expected)
              assert actual_caught == caught_type, (name, actual_caught, caught_type)
              calls = tuple(marker for marker in markers if marker.startswith('call:'))
              if dangerous:
                  assert calls, (name, 'material FN: dangerous call unmarked', markers)
              else:
                  assert calls == (), (name, 'material FP: proven-safe/unreachable call marked', markers)

          execute('new_handler_exception_reaches_outer', source(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a")])',
              '    except* AttributeError:','        b = eval','        raise ValueError("new")',
              '    except* ValueError:','        b = len','except ValueError:','    result = b("1+1")'), 2, dangerous=True)

          execute('safe_inverse_new_handler_exception', source(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a")])',
              '    except* AttributeError:','        b = len','        raise ValueError("new")',
              '    except* ValueError:','        b = eval','except ValueError:','    result = b("abc")'), 3, dangerous=False)

          execute('new_exception_not_matched_by_outer_is_unreachable', source(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a")])',
              '    except* AttributeError:','        b = len','        raise TypeError("new")',
              'except ValueError:','    result = b("1+1")'), None, dangerous=False, caught_type='TypeError')

          execute('later_original_subgroup_runs_before_new_exception_propagates', source(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise TypeError("new")',
              '    except* ValueError:','        b = len','    finally:','        result = b("abc")',
              'except TypeError:','    pass'), 3, dangerous=False)

          execute('fully_consumed_tuple_prevents_later_overlap', source(
              'b = eval','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              'except* (AttributeError, ValueError):','    b = len','except* ValueError:','    b = eval',
              'result = b("abc")'), 3, dangerous=False)

          execute('nonmatching_later_handler_does_not_mutate_successor', source(
              'b = eval','try:','    raise ExceptionGroup("eg", [AttributeError("a")])',
              'except* AttributeError:','    b = len','except* ValueError:','    b = eval','result = b("abc")'), 3, dangerous=False)

          execute('unmatched_remainder_reaches_outer_after_prior_side_effect', source(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','except ExceptionGroup:','    result = b("1+1")'), 2, dangerous=True)

          execute('bare_reraise_later_subgroup_preserves_safe_state', source(
              'b = eval','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = eval','        raise','    except* ValueError:','        b = len',
              'except ExceptionGroup:','    result = b("abc")'), 3, dangerous=False)

          execute('bare_reraise_later_subgroup_can_introduce_danger', source(
              'b = len','try:','    try:','        raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              '    except* AttributeError:','        b = len','        raise','    except* ValueError:','        b = eval',
              'except ExceptionGroup:','    result = b("1+1")'), 2, dangerous=True)

          execute('three_handler_chain_last_matching_state_safe', source(
              'b = eval','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v"), TypeError("t")])',
              'except* AttributeError:','    b = eval','except* ValueError:','    b = eval','except* TypeError:','    b = len',
              'result = b("abc")'), 3, dangerous=False)

          execute('three_handler_chain_last_matching_state_danger', source(
              'b = len','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v"), TypeError("t")])',
              'except* AttributeError:','    b = len','except* ValueError:','    b = len','except* TypeError:','    b = eval',
              'result = b("1+1")'), 2, dangerous=True)

          execute('finally_observes_complete_handler_chain_safe', source(
              'b = eval','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              'except* AttributeError:','    b = eval','except* ValueError:','    b = len','finally:','    result = b("abc")'), 3, dangerous=False)

          execute('finally_observes_complete_handler_chain_danger', source(
              'b = len','try:','    raise ExceptionGroup("eg", [AttributeError("a"), ValueError("v")])',
              'except* AttributeError:','    b = len','except* ValueError:','    b = eval','finally:','    result = b("1+1")'), 2, dangerous=True)

          execute('nested_trystar_inside_function_does_not_leak_module_state', source(
              'b = len','def f():','    try:','        raise ExceptionGroup("eg", [AttributeError("a")])',
              '    except* AttributeError:','        b = eval','f()','result = b("abc")'), 3, dangerous=False)

          execute('three_level_exception_propagation_danger', source(
              'b = len','try:','    try:','        try:','            raise ExceptionGroup("eg", [AttributeError("a")])',
              '        except* AttributeError:','            b = eval','            raise ValueError("v")',
              '    except ValueError:','        raise TypeError("t")','except TypeError:','    result = b("1+1")'), 2, dangerous=True)

          execute('three_level_exception_propagation_safe', source(
              'b = eval','try:','    try:','        try:','            raise ExceptionGroup("eg", [AttributeError("a")])',
              '        except* AttributeError:','            b = len','            raise ValueError("v")',
              '    except ValueError:','        raise TypeError("t")','except TypeError:','    result = b("abc")'), 3, dangerous=False)

          print('PROBE_OK exact-head expanded TryStar adversarial matrix: 16 cases')
          PY